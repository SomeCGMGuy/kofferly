<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#214f3f" />
  <meta name="description" content="Kofferly – offline-first Reiseplanung und Packliste." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./styles-v03.css" />
  <title>Kofferly</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="Kofferly Startseite">Kofferly</button>
      <div class="topbar-actions">
        <span id="networkBadge" class="network-badge">Offline bereit</span>
        <button class="icon-button notification-button" data-action="open-notifications" aria-label="Benachrichtigungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="notificationBadge" class="notification-badge" hidden>0</span>
        </button>
        <button class="icon-button" id="openTripDialog" aria-label="Neue Reise">＋</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-route="home" class="nav-item active">
        <span class="nav-icon">⌂</span><span>Übersicht</span>
      </button>
      <button data-route="packing" class="nav-item">
        <span class="nav-icon">✓</span><span>Packliste</span>
      </button>
      <button data-route="trips" class="nav-item">
        <span class="nav-icon">⌘</span><span>Reisen</span>
      </button>
      <button data-route="settings" class="nav-item">
        <span class="nav-icon">⚙</span><span>Einstellungen</span>
      </button>
    </nav>
  </div>

  <dialog id="tripDialog" class="modal">
    <form method="dialog" id="tripForm" class="modal-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Neue Reise</p>
          <h2>Wohin geht's?</h2>
        </div>
        <button value="cancel" class="icon-button" aria-label="Schließen">×</button>
      </div>

      <label>
        Reiseziel
        <input id="tripDestination" name="destination" required placeholder="z. B. Südtirol" autocomplete="off" />
      </label>

      <label>
        Wetterort <span class="label-hint">optional</span>
        <input id="tripWeatherLocation" name="weatherLocation" placeholder="z. B. Dorf Tirol – falls das Ziel eine Region ist" autocomplete="off" />
        <small class="field-help">Leer lassen, wenn dein Reiseziel bereits ein konkreter Ort ist.</small>
      </label>

      <label>
        Abreise
        <input id="tripDate" name="date" type="date" required />
      </label>

      <label>
        Rückreise
        <input id="tripEndDate" name="endDate" type="date" />
      </label>

      <label>
        Notiz
        <textarea id="tripNote" name="note" rows="3" placeholder="Unterkunft, Treffpunkt, Besonderheiten …"></textarea>
      </label>

      <div class="modal-actions">
        <button value="cancel" class="button ghost">Abbrechen</button>
        <button id="saveTripButton" value="default" class="button primary">Reise anlegen</button>
      </div>
    </form>
  </dialog>

  <dialog id="notificationDialog" class="modal notification-modal">
    <div class="modal-card notification-panel">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Kofferly</p>
          <h2>Benachrichtigungen</h2>
        </div>
        <button type="button" class="icon-button" data-action="close-notifications" aria-label="Schließen">×</button>
      </div>
      <div class="notification-filters" aria-label="Benachrichtigungsfilter">
        <button type="button" class="notification-filter active" data-action="notification-filter" data-filter="all">Alle</button>
        <button type="button" class="notification-filter" data-action="notification-filter" data-filter="important">Wichtig</button>
        <button type="button" class="notification-filter" data-action="notification-filter" data-filter="tips">Tipps</button>
      </div>
      <div id="notificationList" class="notification-list"></div>
      <div class="notification-footer">
        <button type="button" class="button ghost" data-action="mark-notifications-read">Alle als gelesen markieren</button>
      </div>
    </div>
  </dialog>

  <dialog id="openItemsDialog" class="modal">
    <div class="modal-card open-items-panel">
      <div class="modal-head">
        <button type="button" class="icon-button" data-action="close-open-items" aria-label="Zurück">←</button>
        <span></span>
      </div>
      <div class="open-items-head">
        <p class="eyebrow">Noch etwas zu erledigen</p>
        <div class="open-items-plane" aria-hidden="true">✈</div>
        <h2 id="openItemsCountdown">Die Reise startet bald!</h2>
        <p class="muted open-items-intro">Folgende Kategorien sind noch nicht vollständig:</p>
      </div>
      <div id="openItemsList" class="open-category-list"></div>
      <div class="open-items-actions">
        <button type="button" class="button primary" data-action="open-packing-from-dialog">Zur Packliste</button>
        <button type="button" class="button ghost" data-action="remind-later">Später erinnern</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirmDialog" class="modal">
    <form method="dialog" class="modal-card compact">
      <h2 id="confirmTitle">Wirklich löschen?</h2>
      <p id="confirmText" class="muted"></p>
      <div class="modal-actions">
        <button value="cancel" class="button ghost">Abbrechen</button>
        <button value="confirm" class="button danger">Löschen</button>
      </div>
    </form>
  </dialog>

  <template id="emptyTemplate">
    <section class="empty-state card">
      <div class="empty-illustration">🧳</div>
      <p class="eyebrow">Kofferly</p>
      <h1>Die nächste Reise kann kommen.</h1>
      <p>Lege eine Reise an. Kofferly speichert Packliste, Reisezielbild und Wetterdaten lokal auf diesem Gerät.</p>
      <button class="button primary" data-action="new-trip">Erste Reise anlegen</button>
    </section>
  </template>

  <script type="module" src="./js/bootstrap.js"></script>
</body>
</html>
