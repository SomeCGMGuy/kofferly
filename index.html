<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#214f3f" />
  <meta name="description" content="Kofferly – offline-first Reiseplanung und Packliste." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./v030.css" />
  <title>Kofferly</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand brand-wordmark" data-route="home" aria-label="Kofferly Startseite">
        <span>Kofferly.</span>
      </button>
      <div class="topbar-actions">
        <span id="networkBadge" class="network-badge header-network-state" aria-hidden="true">Offline bereit</span>
        <button class="icon-button notification-bell" id="notificationBell" aria-label="Benachrichtigungen" aria-haspopup="dialog">
          <span aria-hidden="true">🔔</span>
          <span id="notificationBadge" class="notification-badge" hidden>0</span>
        </button>
        <button class="icon-button" id="openTripDialog" aria-label="Neue Reise">＋</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-route="home" class="nav-item active">
        <span class="nav-icon">⌂</span><span>Übersicht</span>
      </button>
      <button data-route="packing" class="nav-item">
        <span class="nav-icon">✓</span><span>Packliste</span>
      </button>
      <button data-route="trips" class="nav-item">
        <span class="nav-icon">⌘</span><span>Reisen</span>
      </button>
      <button data-route="settings" class="nav-item">
        <span class="nav-icon">⚙</span><span>Einstellungen</span>
      </button>
    </nav>
  </div>

  <dialog id="tripDialog" class="modal">
    <form method="dialog" id="tripForm" class="modal-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Neue Reise</p>
          <h2>Wohin geht's?</h2>
        </div>
        <button value="cancel" class="icon-button" aria-label="Schließen">×</button>
      </div>

      <label>
        Reiseziel
        <input id="tripDestination" name="destination" required placeholder="z. B. Südtirol oder Donaukreuzfahrt" autocomplete="off" />
      </label>

      <label>
        Packprofil <span class="label-hint">optional</span>
        <select id="tripPackProfile" name="packProfile">
          <option value="neutral">Keine Angabe</option>
          <option value="women">Damen</option>
          <option value="men">Herren</option>
          <option value="couple">Paar</option>
        </select>
        <small class="field-help">Das Paar-Profil rechnet persönliche Mengen für zwei Reisende. Damen- und Paar-Profil ergänzen außerdem persönliche Hygieneartikel.</small>
      </label>

      <label>
        Wetterorte <span class="label-hint">optional</span>
        <textarea id="tripWeatherLocation" name="weatherLocation" rows="3" placeholder="Ein Ort pro Zeile, z. B.&#10;Passau&#10;Wien&#10;Budapest" autocomplete="off"></textarea>
        <small class="field-help">Für Rundreisen oder Kreuzfahrten kannst du mehrere Stationen angeben. Kofferly berücksichtigt für die Packliste den ungünstigsten Wetterfall entlang der Route.</small>
      </label>

      <label>
        Abreise
        <input id="tripDate" name="date" type="date" required />
      </label>

      <label>
        Rückreise
        <input id="tripEndDate" name="endDate" type="date" />
      </label>

      <label>
        Notiz
        <textarea id="tripNote" name="note" rows="3" placeholder="Unterkunft, Treffpunkt, Besonderheiten …"></textarea>
      </label>

      <div class="modal-actions">
        <button value="cancel" class="button ghost">Abbrechen</button>
        <button id="saveTripButton" value="default" class="button primary">Reise anlegen</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="modal">
    <form method="dialog" class="modal-card compact">
      <h2 id="confirmTitle">Wirklich löschen?</h2>
      <p id="confirmText" class="muted"></p>
      <div class="modal-actions">
        <button value="cancel" class="button ghost">Abbrechen</button>
        <button value="confirm" class="button danger">Löschen</button>
      </div>
    </form>
  </dialog>

  <dialog id="notificationDialog" class="modal notification-dialog">
    <section class="modal-card notification-sheet">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Kofferly</p>
          <h2>Benachrichtigungen</h2>
        </div>
        <button class="icon-button" type="button" data-notification-close aria-label="Schließen">×</button>
      </div>
      <div id="notificationList" class="notification-list"></div>
    </section>
  </dialog>

  <dialog id="quickItemDialog" class="modal">
    <form id="quickItemForm" class="modal-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Packliste</p>
          <h2>Aufgabe hinzufügen</h2>
        </div>
        <button class="icon-button" type="button" data-quick-item-close aria-label="Schließen">×</button>
      </div>

      <label>
        Aufgabe
        <input name="name" required placeholder="z. B. Sonnenbrille" autocomplete="off" />
      </label>

      <label>
        Kategorie
        <select id="quickItemCategory" name="category" aria-label="Kategorie"></select>
      </label>

      <label class="quick-important-row">
        <input type="checkbox" name="important" />
        <span>Als wichtig markieren</span>
      </label>

      <div class="modal-actions">
        <button type="button" class="button ghost" data-quick-item-close>Abbrechen</button>
        <button type="submit" class="button primary">Hinzufügen</button>
      </div>
    </form>
  </dialog>

  <dialog id="installPromptDialog" class="modal">
    <section class="modal-card compact">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Kofferly für dein Smartphone</p>
          <h2>Als App installieren?</h2>
        </div>
        <button class="icon-button" type="button" data-install-remind-later aria-label="Später">×</button>
      </div>
      <p class="muted">Installiere Kofferly auf deinem Homescreen. Dann öffnet es sich wie eine normale App und bleibt auch offline verfügbar.</p>
      <div class="modal-actions">
        <button type="button" class="button ghost" data-install-remind-later>Später</button>
        <button type="button" class="button primary" data-install-prompt-now>Jetzt installieren</button>
      </div>
    </section>
  </dialog>

  <template id="emptyTemplate">
    <section class="empty-state card">
      <div class="empty-illustration">🧳</div>
      <p class="eyebrow">Kofferly</p>
      <h1>Die nächste Reise kann kommen.</h1>
      <p>Lege eine Reise an. Kofferly speichert Packliste, Reisezielbild und Wetterdaten lokal auf diesem Gerät.</p>
      <button class="button primary" data-action="new-trip">Erste Reise anlegen</button>
    </section>
  </template>

  <script type="module" src="./js/push-navigation.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/v030.js"></script>
  <script type="module" src="./js/backup.js"></script>
  <script type="module" src="./js/packing-tools.js"></script>
  <script type="module" src="./js/travel-profile.js"></script>
</body>
</html>
